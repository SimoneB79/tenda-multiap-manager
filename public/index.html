<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenda Multi-AP Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="/css/app.css?v=20260714b">
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="app-tmpl">

<!-- ── SETUP WIZARD ── -->
<template v-if="setupNeeded && mainView === 'setup'">
  <div class="setup-wrapper">
    <div class="setup-container">
      <div class="setup-logo">📡</div>
      <h1 class="setup-title">Tenda Multi-AP Manager</h1>
      <p class="setup-subtitle">Setup Wizard</p>

      <!-- Step 1: Discovery -->
      <div v-if="setupStep === 1" class="setup-step">
        <h2>Step 1 — Discover your Tenda APs</h2>
        <p class="setup-hint">Enter your network subnet to auto-discover Tenda access points.</p>
        <div class="setup-form-row">
          <div class="input-group">
            <label>Subnet</label>
            <input type="text" v-model="setupSubnet" placeholder="192.168.0" class="edit-input">
            <small>Format: 192.168.0 (without the last octet)</small>
          </div>
          <button class="btn btn-primary" @click="runDiscovery" :disabled="setupDiscovering">
            <span v-if="setupDiscovering" class="spinner"></span>
            <span v-if="!setupDiscovering">🔍 Scan Network</span>
            <span v-if="setupDiscovering">Scanning...</span>
          </button>
        </div>

        <div v-if="setupDiscovering" class="setup-scanning">
          <div class="spinner-large"></div>
          <p>Scanning {{ setupSubnet }}.0/24... This takes about 10-15 seconds.</p>
        </div>

        <div v-if="setupDiscovered.length > 0" class="setup-discovered">
          <h3>Found {{ setupDiscovered.length }} AP(s)</h3>
          <div v-for="(ap, i) in setupSelectedAps" :key="ap.ip || i" class="setup-ap-row">
            <label class="checkbox-label">
              <input type="checkbox" v-model="ap.selected">
              <span class="ap-ip">{{ ap.ip }}</span>
              <span class="ap-model">{{ ap.model }}</span>
            </label>
            <input type="text" v-model="ap.name" placeholder="AP name" class="edit-input setup-ap-name">
            <input type="text" v-model="ap.location" placeholder="Location (optional)" class="edit-input setup-ap-loc">
          </div>
          <button class="btn btn-link" @click="addManualAp">+ Add AP manually</button>
        </div>

        <div v-if="setupSelectedAps.length > 0" class="setup-nav">
          <button class="btn btn-primary" @click="setupStep = 2" :disabled="!setupSelectedAps.some(a => a.selected)">
            Next →
          </button>
        </div>
      </div>

      <!-- Step 2: Password + Test -->
      <div v-if="setupStep === 2" class="setup-step">
        <h2>Step 2 — Enter AP Password</h2>
        <p class="setup-hint">Enter the admin password for your Tenda APs. This password is used for all APs.</p>
        <div class="setup-form-row">
          <div class="input-group">
            <label>Password</label>
            <input type="password" v-model="setupPassword" placeholder="Admin password" class="edit-input">
          </div>
          <button class="btn btn-primary" @click="testSetupConnections" :disabled="setupTesting || !setupPassword">
            <span v-if="setupTesting" class="spinner"></span>
            <span v-if="!setupTesting">🔑 Test Connection</span>
            <span v-if="setupTesting">Testing...</span>
          </button>
        </div>

        <div v-if="Object.keys(setupTestResults).length > 0" class="setup-results">
          <div v-for="(result, ip) in setupTestResults" :key="ip" class="setup-test-row" :class="result.success ? 'ok' : 'fail'">
            <span>{{ ip }}</span>
            <span v-if="result.success">✅ {{ result.model }}</span>
            <span v-else>❌ {{ result.error }}</span>
          </div>
        </div>

        <div class="setup-nav">
          <button class="btn btn-outline" @click="setupStep = 1">← Back</button>
          <button class="btn btn-primary" @click="saveSetup" :disabled="setupSaving">
            <span v-if="setupSaving" class="spinner"></span>
            <span v-if="!setupSaving">✓ Complete Setup</span>
            <span v-if="setupSaving">Saving...</span>
          </button>
        </div>
      </div>

      <!-- Step 3: Done -->
      <div v-if="setupStep === 3" class="setup-step">
        <h2>✅ Setup Complete!</h2>
        <p>Your APs have been configured. You can now manage them from the dashboard.</p>
        <button class="btn btn-primary" @click="refreshAll(); setupNeeded = false;">Go to Dashboard →</button>
      </div>
    </div>
  </div>
</template>

<!-- ── MAIN APP ── -->
<template v-if="!setupNeeded || mainView !== 'setup'">
<header class="topbar">
  <button class="hamburger" @click="sidebarOpen = !sidebarOpen" :class="{ active: sidebarOpen }">
    <span></span><span></span><span></span>
  </button>
  <div class="topbar-left"><span class="logo">📡 Tenda Multi-AP Manager</span></div>
  <div class="topbar-center">
    <select v-model="selApId" class="topbar-ap-select" v-if="mainView === 'dashboard'">
      <option value="">— Scegli AP —</option>
      <option v-for="ap in aps" :key="ap.id" :value="ap.id">{{ ap.name }} ({{ ap.ip }})</option>
    </select>
  </div>
  <div class="topbar-right">
    <button class="btn btn-sm btn-outline" @click="refreshAll" :disabled="loading">
      <span v-if="loading" class="spinner"></span><span v-else>↻</span> Refresh
    </button>
  </div>
</header>

<div class="sidebar-backdrop" :class="{ visible: sidebarOpen }" @click="sidebarOpen = false"></div>
<div class="layout">
  <aside class="sidebar" :class="{ open: sidebarOpen }">
    <nav class="sidebar-nav">
      <a :class="{ active: mainView === 'dashboard' }" @click.prevent="mainView = 'dashboard'; sidebarOpen = false">
        <span class="nav-icon">⊞</span> Dashboard
      </a>
      <a :class="{ active: mainView === 'compare' }" @click.prevent="mainView = 'compare'; sidebarOpen = false">
        <span class="nav-icon">⇄</span> Confronta
      </a>
      <a :class="{ active: mainView === 'bulk' }" @click.prevent="mainView = 'bulk'; sidebarOpen = false">
        <span class="nav-icon">⚡</span> Modifica multipla
      </a>
      <a :class="{ active: mainView === 'tools' }" @click.prevent="mainView = 'tools'; sidebarOpen = false">
        <span class="nav-icon">🔧</span> Strumenti
      </a>
      <a :class="{ active: mainView === 'firmware' }" @click.prevent="mainView = 'firmware'; sidebarOpen = false">
        <span class="nav-icon">📦</span> Firmware
      </a>
    </nav>
  </aside>

  <main class="content">
    <!-- ═══════ DASHBOARD ═══════ -->
    <div v-if="mainView === 'dashboard'">
      <!-- Overview strip (always visible) -->
      <div class="overview-strip">
        <div class="overview-stats">
          <div class="ov-stat">
            <span class="ov-number" :class="{ 'ov-ok': dashboardSummary.online === dashboardSummary.total }">{{ dashboardSummary.online }}/{{ dashboardSummary.total }}</span>
            <span class="ov-label">AP Online</span>
          </div>
          <div class="ov-stat">
            <span class="ov-number">{{ dashboardSummary.totalClients }}</span>
            <span class="ov-label">Client</span>
          </div>
        </div>
        <div v-if="dashboardSummary.offline > 0" class="ov-alert">
          ⚠️ {{ dashboardSummary.offline }} offline: {{ offlineAps.map(a => a.name).join(', ') }}
        </div>
        <div v-else class="ov-ok-msg">✅ Tutti online</div>
      </div>

      <!-- AP mini-cards strip (always visible, dynamic) -->
      <div class="ap-strip">
        <div v-for="ap in aps" :key="ap.id"
             class="ap-mini"
             :class="{ offline: !ap.online, disabled: ap.enabled === false, selected: selApId === ap.id }"
             @click="selApId = ap.id">
          <span class="mini-dot" :class="ap.online ? 'dot-on' : 'dot-off'"></span>
          <span class="mini-name">{{ ap.name }}</span>
          <span class="mini-ip">{{ ap.ip }}</span>
          <span class="mini-clients" v-if="mqttStatus[ap.id]?.online">{{ (mqttStatus[ap.id].clients_24g || 0) + (mqttStatus[ap.id].clients_5g || 0) }} 👥</span>
        </div>
      </div>

      <!-- AP selected → Tab Editor -->
      <div v-if="selApId">
        <div class="tab-bar" v-if="tabs">
          <button v-for="(tab, key) in tabs" :key="key" :class="['tab-btn', { active: selTab === key }]" @click="setTab(key)">
            {{ tab.icon || '•' }} {{ tab.label }}
          </button>
        </div>

        <div v-if="error" class="alert alert-error">{{ error }}</div>
        <div v-if="msg" class="alert alert-ok">{{ msg }}</div>

        <div v-if="snapshot" class="tab-content">
          <!-- STATUS TAB -->
          <div v-if="selTab === 'status'" class="status-grid">
            <div class="ap-info-card" v-if="selAp">
              <h2>📋 {{ selAp.name }}</h2>
              <div class="info-rows">
                <div class="info-row"><strong>Modello</strong>: <span>{{ selAp.model }}</span></div>
                <div class="info-row"><strong>IP</strong>: <span>{{ selAp.ip }}</span></div>
                <div class="info-row"><strong>Firmware</strong>: <span>{{ selAp.firmware || '—' }}</span></div>
              </div>
            </div>
            <div v-for="snapKey in ['clients_24g','clients_5g']" :key="snapKey" class="client-card">
              <h3>{{ snapKey === 'clients_5g' ? '📶 Client 5 GHz' : '📶 Client 2.4 GHz' }}</h3>
              <div v-if="getModuleData(snapKey)?.length" class="clients-grid">
                <table class="clients-table">
                  <thead><tr><th>MAC</th><th>IP</th><th>Segnale</th><th>Tx Rate</th><th>Connesso</th></tr></thead>
                  <tbody>
                    <tr v-for="cl in getModuleData(snapKey)" :key="cl.mac">
                      <td class="monospace">{{ cl.mac }}</td><td>{{ cl.ip }}</td>
                      <td><span :class="signalClass(clientSignal(cl))">{{ clientSignal(cl) || '—' }}<span v-if="cl.signNoise" class="signal-noise">({{ cl.signNoise }})</span></span></td>
                      <td>{{ cl.txRate || '—' }}<span v-if="cl.txRate"> Mbps</span></td><td>{{ cl.connectTime || '—' }}<span v-if="cl.connectTime">s</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <p v-else class="text-muted">Nessun client</p>
            </div>
          </div>

          <!-- CONFIG TABS -->
          <div v-if="selTab !== 'status'" class="config-sections">
            <div v-for="modName in currentTab.modules" :key="modName" class="config-block">
              <div class="config-block-header">
                <h3>{{ fieldDefs?.fields?.[modName]?.label || modName }}</h3>
                <div class="config-block-actions">
                  <button v-if="fieldDefs?.fields?.[modName]?.setter" class="btn btn-sm btn-primary"
                          @click="fieldDefs?.fields?.[modName]?.passwordRequired ? requestPassword(modName) : saveModule(modName)"
                          :disabled="saving[modName]">
                    <span v-if="saving[modName]" class="spinner"></span><span v-else>💾</span> Salva
                  </button>
                </div>
              </div>
              <div v-if="saveErrors[modName]" class="alert alert-error">{{ saveErrors[modName] }}</div>

              <!-- Regular fields -->
              <div v-if="fieldDefs?.fields?.[modName]?.fields" class="form-grid">
                <div v-for="(fdef, fkey) in fieldDefs.fields[modName].fields" :key="fkey"
                     v-show="isShown(fkey, fdef, editorVals[modName])" class="form-field">
                  <label>{{ fdef.label }}</label>

                  <label v-if="fdef.type === 'toggle'" class="toggle">
                    <input type="checkbox" :checked="getFieldValue(fkey, fdef, editorVals[modName])"
                           @change="editorVals[modName][fkey] = $event.target.checked" :disabled="fdef.readonly">
                    <span class="toggle-slider"></span>
                  </label>

                  <select v-else-if="fdef.type === 'select' && fdef.options" class="edit-select"
                          :value="getFieldValue(fkey, fdef, editorVals[modName])"
                          @change="editorVals[modName][fkey] = $event.target.value" :disabled="fdef.readonly">
                    <option v-for="(label, val) in resolveOptions(fdef.options)" :key="val" :value="val">{{ label }}</option>
                  </select>

                  <div v-else-if="fdef.type === 'slider'" class="slider-row">
                    <input type="range" :min="fdef.min" :max="fdef.max" :step="fdef.step || 1"
                           :value="getFieldValue(fkey, fdef, editorVals[modName])"
                           @input="editorVals[modName][fkey] = Number($event.target.value)" :disabled="fdef.readonly">
                    <span class="slider-val">{{ editorVals[modName]?.[fkey] || getFieldValue(fkey, fdef, editorVals[modName]) }} {{ fdef.suffix || '' }}</span>
                  </div>

                  <input v-else-if="fdef.type === 'password'" type="password" class="edit-input"
                         :value="getFieldValue(fkey, fdef, editorVals[modName])"
                         @input="editorVals[modName][fkey] = $event.target.value" :disabled="fdef.readonly">

                  <span v-else-if="fdef.readonly" class="readonly-val">{{ getFieldValue(fkey, fdef, editorVals[modName]) }}</span>

                  <input v-else-if="fdef.type === 'number'" type="number" class="edit-input" :min="fdef.min" :max="fdef.max"
                         :step="fdef.step || 1" :value="getFieldValue(fkey, fdef, editorVals[modName])"
                         @input="editorVals[modName][fkey] = Number($event.target.value)">

                  <input v-else type="text" class="edit-input"
                         :value="getFieldValue(fkey, fdef, editorVals[modName])"
                         @input="editorVals[modName][fkey] = $event.target.value" :disabled="fdef.readonly"
                         :maxlength="fdef.maxLength" :placeholder="fdef.placeholder || ''">

                  <span v-if="fdef.hint" class="field-hint">{{ fdef.hint }}</span>
                </div>
              </div>

              <!-- Tabular editors -->
              <div v-if="fieldDefs?.fields?.[modName]?.tabular && fieldDefs?.fields?.[modName]?.tables" class="tabular-editor">
                <div v-for="(tdef, tkey) in fieldDefs.fields[modName].tables" :key="tkey">
                  <h4 style="margin-top:12px">{{ tdef.label }}</h4>

                  <!-- MAC List -->
                  <div v-if="tkey === 'macList'">
                    <table class="tabular-table">
                      <thead><tr><th>MAC Address</th><th></th></tr></thead>
                      <tbody>
                        <tr v-for="(row, ri) in (editorVals[modName + '.macList'] || getModuleData(modName)?.macList || [])" :key="ri">
                          <td class="monospace">{{ row.mac || row }}</td>
                          <td><button class="btn btn-sm btn-outline" @click="removeMacRow(modName, ri)">✕</button></td>
                        </tr>
                      </tbody>
                    </table>
                    <button class="btn btn-sm btn-outline" style="margin-top:6px" @click="addMacRow(modName)">+ Aggiungi MAC</button>
                  </div>

                  <!-- WiFi Schedule -->
                  <div v-else-if="tkey === 'schedules'">
                    <table class="tabular-table">
                      <thead><tr><th>SSID</th><th>Attivo</th><th>Schedule On</th><th>Fascia oraria</th></tr></thead>
                      <tbody>
                        <tr v-for="(row, si) in (getModuleData(modName)?.schedules || [])" :key="si" v-if="row">
                          <td>{{ row.ssid || ('SSID#' + row.ssidIndex) }}</td>
                          <td>{{ row.wifiSsidEn ? '✓' : '✗' }}</td>
                          <td>
                            <label class="toggle">
                              <input type="checkbox" :checked="row.enable">
                              <span class="toggle-slider"></span>
                            </label>
                          </td>
                          <td>
                            <input type="text" class="edit-input"
                                   :value="(row.scheduledList && row.scheduledList[0]) ? row.scheduledList[0].time : ''"
                                   @input="setScheduleTime(si, 0, $event.target.value)"
                                   placeholder="HH:MM-HH:MM" style="width:200px">
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <!-- EDCA Tables -->
                  <div v-else-if="tdef.edcaKeys">
                    <table class="tabular-table">
                      <thead><tr><th>AC</th><th v-for="col in tdef.columns" :key="col.key">{{ col.label }}</th></tr></thead>
                      <tbody>
                        <tr v-for="(val, acIdx) in initEdcaVals(modName, tkey)" :key="acIdx">
                          <td>{{ ['BE','BK','VI','VO'][acIdx] || 'AC'+acIdx }}</td>
                          <td v-for="col in tdef.columns" :key="col.key">
                            <input type="number" class="edit-input" style="width:70px"
                                   v-model="editorVals[modName+'.'+tkey][acIdx][col.key.replace('ed','').toLowerCase()]">
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <!-- Generic tabular (VLAN, QoS) -->
                  <div v-else>
                    <table class="tabular-table">
                      <thead><tr><th v-for="col in tdef.columns" :key="col.key">{{ col.label }}</th></tr></thead>
                      <tbody>
                        <tr v-for="(row, ri) in (getModuleData(modName)?.[tkey] || [])" :key="ri">
                          <td v-for="col in tdef.columns" :key="col.key">
                            <span v-if="col.readonly || !col.key">{{ row[col.key] }}</span>
                            <label v-else-if="col.type === 'toggle'" class="toggle">
                              <input type="checkbox" :checked="row[col.key] === '1' || row[col.key] === true">
                              <span class="toggle-slider"></span>
                            </label>
                            <select v-else-if="col.type === 'select' && col.options" class="edit-select" style="min-width:90px">
                              <option v-for="(lbl, opt) in col.options" :key="opt" :value="opt" :selected="row[col.key] === opt">{{ lbl }}</option>
                            </select>
                            <input v-else type="text" class="edit-input" style="width:130px"
                                   :value="row[col.key] || ''" :placeholder="col.placeholder || ''">
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

                <button v-if="modName === 'qvlanGet'" class="btn btn-sm btn-primary" style="margin-top:10px" @click="saveVlanTable">💾 Salva VLAN</button>
                <button v-if="modName === 'qosManageGet'" class="btn btn-sm btn-primary" style="margin-top:10px" @click="saveQosTable">💾 Salva Traffic Control</button>
              </div>
            </div>
          </div>
        </div>

        <div v-if="!snapshot && loading" class="loading-state"><div class="spinner-lg"></div><p>Caricamento configurazione...</p></div>
      </div>
    </div>

    <!-- ═══════ COMPARE ═══════ -->
    <div v-if="mainView === 'compare'" class="compare">
      <div class="page-header"><h1>⇄ Confronta AP</h1></div>
      <div class="compare-select" style="display:flex;gap:12px;align-items:center;padding:16px">
        <select v-model="compareLeft" class="edit-select" style="min-width:150px">
          <option value="">— AP 1 —</option>
          <option v-for="ap in onlineAps" :key="ap.id" :value="ap.id">{{ ap.name }}</option>
        </select>
        <span style="font-size:20px;color:#888">vs</span>
        <select v-model="compareRight" class="edit-select" style="min-width:150px">
          <option value="">— AP 2 —</option>
          <option v-for="ap in onlineAps" :key="ap.id" :value="ap.id">{{ ap.name }}</option>
        </select>
        <button class="btn btn-primary" @click="runCompare" :disabled="!compareLeft || !compareRight || compareLoading">
          <span v-if="compareLoading" class="spinner"></span> Confronta
        </button>
      </div>
      <div v-if="compareLoading" class="loading-state"><div class="spinner-lg"></div></div>
      <div v-if="compareResult" class="compare-result" style="padding:16px">
        <div v-for="(items, cat) in compareResult.grouped || {}" :key="cat" style="margin-top:16px">
          <h2 style="margin-bottom:8px;color:#aaa;text-transform:uppercase;font-size:13px">{{ cat }}</h2>
          <table class="config-table">
            <thead><tr><th>Parametro</th><th>{{ compareResult.left?.name }}</th><th>{{ compareResult.right?.name }}</th></tr></thead>
            <tbody>
              <tr v-for="item in items" :key="item.key">
                <td>{{ item.label }}</td>
                <td :class="{ 'text-error': item.left !== item.right }">{{ formatCompareVal(item.left) }}</td>
                <td :class="{ 'text-error': item.left !== item.right }">{{ formatCompareVal(item.right) }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ═══════ BULK ═══════ -->
    <div v-if="mainView === 'bulk'" class="bulk">
      <div class="page-header"><h1>⚡ Modifica multipla</h1></div>
      <div class="tool-card">
        <h2>🧹 Pulizia SSID inutilizzati</h2>
        <p class="hint" style="color:#888;margin:4px 0 10px">Disabilita e rinomina a "-" tutti gli SSID #2–#8 (2.4G + 5G) su tutti gli AP online. SSID #1 invariato.</p>
        <button class="btn btn-warning" @click="cleanupSsids" :disabled="cleaning">
          <span v-if="cleaning" class="spinner"></span><span v-else>🧹</span> Pulisci tutti
        </button>
        <div v-if="cleanupResults" style="margin-top:10px">
          <div v-for="(res, id) in cleanupResults" :key="id" :class="res.success ? 'text-yes' : 'text-error'">
            {{ getApName(id) }}: {{ res.success ? '✅ ' + (res.count || 'OK') : '❌ ' + res.error }}
          </div>
        </div>
      </div>
      <div class="tool-card" style="margin-top:16px">
        <h2>📋 Copia config da sorgente</h2>
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <select v-model="bulkSource" class="edit-select" style="min-width:150px" @change="onBulkSourceChange">
            <option value="">— AP sorgente —</option>
            <option v-for="ap in onlineAps" :key="ap.id" :value="ap.id">{{ ap.name }}</option>
          </select>
          <span style="font-size:18px">→</span>
          <div class="bulk-ap-list">
            <label v-for="ap in aps" :key="ap.id" class="bulk-ap-check">
              <input type="checkbox" :value="ap.id" v-model="bulkTargets"> {{ ap.name }}
            </label>
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:10px" @click="showBulkModal = true" :disabled="!bulkSource || bulkTargets.length === 0">
          ⚡ Scegli moduli da copiare su {{ bulkTargets.length }} AP
        </button>
        <div v-if="bulkResults" style="margin-top:10px">
          <div v-for="(res, id) in bulkResults" :key="id" :class="res.success ? 'text-yes' : 'text-error'">
            {{ getApName(id) }}: {{ res.success ? '✅' : '❌ ' + res.error }}
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════ TOOLS ═══════ -->
    <div v-if="mainView === 'tools'" class="tools">
      <div class="page-header"><h1>🔧 Strumenti</h1></div>

      <div class="tool-card">
        <h2>🔄 Riavvio AP</h2>
        <p class="hint" style="color:#888;margin:4px 0 10px">Seleziona uno o più AP da riavviare. L'operazione richiede 30-60 secondi per AP.</p>
        <div class="bulk-ap-list" style="margin-bottom:10px">
          <label v-for="ap in onlineAps" :key="ap.id" class="bulk-ap-check">
            <input type="checkbox" :value="ap.id" v-model="rebootTargets">
            <span class="status-dot" :class="ap.online ? 'dot-green' : 'dot-red'"></span>
            {{ ap.name }} ({{ ap.ip }})
          </label>
        </div>
        <div class="tool-actions" style="display:flex;gap:8px">
          <button class="btn btn-danger" @click="startReboot" :disabled="rebootTargets.length === 0">
            🔄 Riavvia {{ rebootTargets.length > 0 ? rebootTargets.length + ' AP' : '' }}
          </button>
          <button class="btn btn-outline" @click="rebootTargets = onlineAps.map(a => a.id)">Tutti</button>
          <button class="btn btn-outline" @click="rebootTargets = []">Nessuno</button>
        </div>
      </div>

      <div class="tool-card" style="margin-top:16px">
        <h2>🌐 Uplink Detection</h2>
        <p class="hint" style="color:#888;margin:4px 0 10px">L'AP pinga due host a intervalli regolari. Se entrambi non rispondono, l'AP considera l'uplink down.</p>
        <div class="form-grid">
          <div class="form-field"><label>Host IP 1 (es. router)</label><input type="text" class="edit-input" v-model="uplinkConfig.hostIp1" placeholder="192.168.0.10"></div>
          <div class="form-field"><label>Host IP 2 (es. DNS pubblico)</label><input type="text" class="edit-input" v-model="uplinkConfig.hostIp2" placeholder="8.8.8.8"></div>
          <div class="form-field">
            <label>Intervallo (secondi)</label>
            <select v-model="uplinkConfig.timeInterval" class="edit-select">
              <option value="5">5s</option><option value="10">10s</option><option value="30">30s</option><option value="60">60s</option>
            </select>
          </div>
        </div>
        <div class="bulk-ap-list" style="margin:10px 0">
          <label v-for="ap in onlineAps" :key="ap.id" class="bulk-ap-check">
            <input type="checkbox" :value="ap.id" v-model="uplinkTargets"> {{ ap.name }}
          </label>
        </div>
        <button class="btn btn-primary" @click="applyUplink" :disabled="uplinkTargets.length === 0 || uplinkSaving">
          <span v-if="uplinkSaving" class="spinner"></span><span v-else>🌐</span> Attiva su {{ uplinkTargets.length }} AP
        </button>
      </div>
    </div>

    <!-- ═══════ FIRMWARE ═══════ -->
<div v-if="mainView === 'firmware'" class="firmware">
      <div class="page-header"><h1>📦 Firmware</h1></div>

      <div class="tool-card">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
          <button class="btn btn-outline btn-sm" @click="loadFirmwareInfo" :disabled="fwLoading">
            <span v-if="fwLoading" class="spinner"></span><span v-else>↻</span> Aggiorna
          </button>
          <button class="btn btn-outline btn-sm" @click="checkOnlineAll" :disabled="fwOnlineCheck">
            <span v-if="fwOnlineCheck" class="spinner"></span><span v-else>🌐</span> Controlla online
          </button>
          <span v-if="lastOnlineCheck" style="color:#666;font-size:11px">Ultimo: {{ lastOnlineCheck }}</span>
        </div>
        <table v-if="fwInfo.length" class="config-table">
          <thead><tr><th style="width:30px"></th><th>AP</th><th>Versione</th><th>Stato online</th><th style="width:120px"></th></tr></thead>
          <tbody>
            <tr v-for="f in fwInfo" :key="f.id">
              <td><input type="checkbox" v-model="fwBatchTargets" :value="f.id"></td>
              <td>{{ f.name }} <span style="color:#666;font-size:11px">{{ f.model }}</span></td>
              <td>{{ f.firmware || '—' }}</td>
              <td>
                <span v-if="f.onlineStatus == null" style="color:#666">—</span>
                <span v-else-if="f.onlineStatus === 1" style="color:var(--green)">✅ Aggiornato</span>
                <span v-else-if="f.onlineStatus === 2" style="color:var(--yellow)">
                  ⬆ {{ f.newVersion }}
                </span>
                <span v-else-if="f.onlineStatus === 5" style="color:var(--red)">Server non raggiungibile</span>
                <span v-else style="color:#888">🔍 Controllo...</span>
              </td>
              <td>
                <button v-if="f.onlineStatus === 2" class="btn btn-primary btn-sm" @click="startOnlineUpgrade(f.id)" :disabled="f.upgrading">
                  <span v-if="f.upgrading" class="spinner"></span>
                  <span v-else>⬆</span> Aggiorna
                </button>
                <span v-if="f.upgradeDone" style="color:var(--green);font-size:11px">Avviato ✓</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="tool-card" style="margin-top:12px">
        <h3>📁 Upload file firmware (.bin)</h3>
        <p style="color:#888;font-size:12px">Scarica il .bin dal sito Tenda. Seleziona gli AP target qui sopra.</p>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
          <input type="file" accept=".bin" @change="onFwFileSelected" ref="fwFileInput" style="color:#ccc">
          <button class="btn btn-primary btn-sm" @click="uploadBatchFirmware" :disabled="!fwFile || !fwBatchTargets.length || fwBatchUploading">
            <span v-if="fwBatchUploading" class="spinner"></span>
            <span v-else>⬆</span> Upload su {{ fwBatchTargets.length }} AP
          </button>
        </div>
        <div v-if="fwBatchResults" style="margin-top:8px">
          <div v-for="(r, id) in fwBatchResults" :key="id" :style="{color: r.success ? 'var(--green)' : 'var(--red)'}">
            {{ getApName(id) }}: {{ r.success ? '✓ OK — riavvio...' : '✗ ' + (r.error || r.message) }}
          </div>
        </div>
      </div>
<!-- Password Modal -->
<div v-if="passwordModal.show" class="modal-overlay" @click.self="cancelPassword">
  <div class="modal modal-sm">
    <h3>🔒 Password Admin Richiesta</h3>
    <p style="margin-top:6px;color:#999">{{ fieldDefs?.fields?.[passwordModal.moduleKey]?.label || passwordModal.moduleKey }}</p>
    <input type="password" v-model="passwordModal.pwd" class="edit-input" placeholder="Password admin AP" style="width:100%;margin:10px 0">
    <div class="modal-actions">
      <button class="btn btn-outline" @click="cancelPassword">Annulla</button>
      <button class="btn btn-primary" @click="confirmPassword" :disabled="!passwordModal.pwd">Conferma</button>
    </div>
  </div>
</div>

<!-- Bulk Select Modal -->
<div v-if="showBulkModal" class="modal-overlay">
  <div class="modal modal-lg">
    <h3>📋 Scegli cosa copiare</h3>
    <p style="color:#888;font-size:12px;margin-top:4px">
      Da <strong>{{ getApName(bulkSource) }}</strong> → {{ bulkTargets.length }} AP dello stesso modello.
    </p>
    <div style="max-height:55vh;overflow-y:auto;margin:8px 0;font-size:13px">
      <template v-for="group in bulkGroups" :key="group.cat">
        <div style="color:var(--accent);font-size:11px;text-transform:uppercase;margin:10px 0 4px;letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:2px">
          {{ group.label }}
        </div>
        <label v-for="mod in group.items" :key="mod.key" style="display:flex;align-items:center;gap:6px;padding:3px 0 3px 8px;cursor:pointer">
          <input type="checkbox" v-model="mod.checked" :disabled="mod.unique">
          <span :style="{color: mod.unique ? '#666' : '#ccc'}">{{ mod.desc }}</span>
          <span v-if="mod.unique" style="color:var(--yellow);font-size:10px;margin-left:4px">⚠ univoco</span>
        </label>
      </template>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn btn-sm btn-outline" @click="checkAllBulk(true)">Seleziona tutto</button>
      <button class="btn btn-sm btn-outline" @click="checkAllBulk(false)">Deseleziona tutto</button>
    </div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn btn-outline" @click="showBulkModal = false">Annulla</button>
      <button class="btn btn-primary" @click="applyBulkSelected" :disabled="bulkSaving">
        <span v-if="bulkSaving" class="spinner"></span>
        <span v-else>⚡</span> Copia {{ bulkSelectedCount }} impostazioni
      </button>
    </div>
    <div v-if="bulkResults" style="margin-top:10px">
      <div v-for="(res, id) in bulkResults" :key="id" :class="res.success ? 'text-yes' : 'text-error'">
        {{ getApName(id) }}: {{ res.success ? '✅' : '❌ ' + res.error }}
      </div>
    </div>
  </div>
</div>

<!-- Reboot Modal -->
<div v-if="rebootModal" class="modal-overlay" @click.self="rebootModal = false">
  <div class="modal">
    <h3>⚠️ Conferma riavvio</h3>
    <p style="margin-top:6px;color:#aaa">Stai per riavviare <strong>{{ rebootTargets.length > 1 ? rebootTargets.length + ' AP' : getApName(rebootTargets[0]) }}</strong>.</p>
    <p style="color:#888;font-size:12px">Gli AP saranno offline per circa 30-60 secondi.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" @click="rebootModal = false">Annulla</button>
      <button class="btn btn-danger" @click="confirmReboot" :disabled="rebooting">
        <span v-if="rebooting" class="spinner"></span><span v-else>🔄</span> Riavvia
      </button>
    </div>
    <div v-if="rebootResults" style="margin-top:10px">
      <div v-for="(res, id) in rebootResults" :key="id" :class="res.success ? 'text-yes' : 'text-error'">
        {{ getApName(id) }}: {{ res.success ? '✅ Riavviato' : '❌ ' + res.error }}
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container">
  <div v-if="msg" class="toast toast-ok" @click="msg = ''">{{ msg }}</div>
  <div v-if="error" class="toast toast-error" @click="error = ''">{{ error }}</div>
</div>
</template>
</script>

<script src="/js/vue.prod.js?v=20260712"></script>
<script src="/js/app.js?v=20260714b"></script>
</body>
</html>
